<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Kho Phân Nhóm Hóa Chất</title>
    <!-- Thư viện Firebase & SheetJS (Excel) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f4f6f9; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: #fff; margin: 3% auto; padding: 20px; width: 90%; max-width: 1000px; border-radius: 8px; max-height: 90vh; overflow-y: auto; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: #000; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; font-size: 12px; }
        th { background-color: #007bff; color: white; }
        button { padding: 6px 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
        button:hover { opacity: 0.9; }
        .btn-edit { background-color: #ffc107; color: #333; margin-right: 4px; }
        .btn-delete { background-color: #dc3545; }
        input, select { padding: 6px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>Hệ Thống Quản Lý Kho Phân Nhóm Hóa Chất</h2>
    
    <!-- Nút mở modal cấu hình quản lý sản phẩm -->
    <button onclick="openProductModal()" style="background-color: #28a745; font-size: 14px; padding: 10px 15px;">⚙️ Mở Quản Lý Sản Phẩm & Đa Barcode</button>

    <!-- MODAL QUẢN LÝ SẢN PHẨM -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeProductModal()">&times;</span>
            
            <details style="background: #f8f9fa; padding: 8px; border-radius: 4px; border: 1px solid #dee2e6; margin-bottom: 10px;">
                <summary style="cursor: pointer; font-weight: bold; color: #004085; font-size: 13px;">📊 Quản Lý Danh Mục Sản Phẩm Từ Excel</summary>
                <div style="margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button onclick="downloadExcelTemplate()" style="background-color: #17a2b8;">📄 Tải Excel Mẫu</button>
                    <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" style="display: none;" onchange="importProductsFromExcel(this)">
                    <button onclick="document.getElementById('excelFileInput').click()" style="background-color: #28a745;">📂 Chọn File Excel Tải Lên</button>
                    <button onclick="exportProductsToExcel()" style="background-color: #007bff;">📤 Xuất Danh Sách Sản Phẩm (Excel)</button>
                </div>
            </details>
            
            <details style="background: #f8f9fa; padding: 8px; border-radius: 4px; border: 1px solid #dee2e6; margin-bottom: 10px;">
                <summary style="cursor: pointer; font-weight: bold; color: #004085; font-size: 13px;">💾 Sao Lưu & Khôi Phục Dữ Liệu (Backup / Restore)</summary>
                <div style="margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button onclick="exportFullDatabase()" style="background-color: #007bff;">📥 Tải File Sao Lưu (.json)</button>
                    <input type="file" id="importDbFileInput" accept=".json" style="display: none;" onchange="importFullDatabase(this)">
                    <button onclick="document.getElementById('importDbFileInput').click()" style="background-color: #ffc107; color: #333;">📤 Khôi Phục CSDL Từ File</button>
                </div>
            </details>

            <hr style="margin: 10px 0;">

            <div style="background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #dee2e6; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 14px; color: #004085;">Danh Sách Sản Phẩm & Phân Nhóm Kho</h3>
                <input type="text" id="searchMappedProductsInput" placeholder="🔍 Tìm nhanh tên, barcode..." oninput="renderMappedProductsTable()" style="width: 250px;">
            </div>

            <div style="display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap;">
                <select id="newProdCategory" style="flex: 1.5;">
                    <option value="NHÓM MIỄN DỊCH">NHÓM MIỄN DỊCH</option>
                    <option value="NHÓM HUYẾT HỌC - ĐÔNG MÁU">NHÓM HUYẾT HỌC - ĐÔNG MÁU</option>
                    <option value="NHÓM SINH HÓA">NHÓM SINH HÓA</option>
                    <option value="NHÓM VẬT TƯ TIÊU HAO">NHÓM VẬT TƯ TIÊU HAO</option>
                    <option value="NHÓM SHPT (PCR)">NHÓM SHPT (PCR)</option>
                </select>
                <input type="text" id="newProdName" placeholder="Tên SP..." style="flex: 2;">
                <input type="text" id="newProdBarcode" placeholder="Barcode chính..." style="flex: 1.5;">
                <input type="text" id="newProdManufacturer" placeholder="Hãng SX..." style="flex: 1.2;">
                <input type="text" id="newProdMinStock" placeholder="Tồn min" style="flex: 0.8;">
                <input type="text" id="newProdLot" placeholder="LOT mặc định" style="flex: 1;">
                <input type="month" id="newProdExpiry" style="flex: 1.2;">
                <button onclick="addProductMapping()" style="background-color: #28a745; flex: 1;">Thêm Mới</button>
            </div>

            <div style="max-height: 450px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px;">
                <table id="mappedProductsTable">
                    <thead>
                        <tr>
                            <th style="width: 50px; text-align: center;">STT</th>
                            <th>Nhóm SP</th>
                            <th>Tên SP</th>
                            <th>Barcode Chính & Phụ</th>
                            <th>Hãng SX</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- SCRIPT DUY NHẤT ĐỂ TRÁNH XUNG ĐỘT -->
    <script>
        let currentCategory = "NHÓM MIỄN DỊCH";
        let currentUser = { name: "Quản Trị Viên", role: "ADMIN" };
        let toggledProductGroups = {};
        let userAccounts = [];
        let mappedProducts = [];
        let inventory = {};
        let logs = [];

        const firebaseConfig = {
          apiKey: "AIzaSyCODnAwFDbfixlIWQKdgZmMFWVa6M4goJc",
          authDomain: "kho-labpkbvdhyd1.firebaseapp.com",
          databaseURL: "https://kho-labpkbvdhyd1-default-rtdb.firebaseio.com",
          projectId: "kho-labpkbvdhyd1",
          storageBucket: "kho-labpkbvdhyd1.firebasestorage.app",
          messagingSenderId: "1039878184033",
          appId: "1:1039878184033:web:22875e1ce1f2f78c24de20",
          measurementId: "G-GFGRSF4327"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        window.addEventListener('DOMContentLoaded', () => {
            db.ref('mappedProducts').on('value', (snapshot) => {
                let val = snapshot.val();
                if (val) {
                    mappedProducts = Array.isArray(val) ? val : Object.values(val);
                } else {
                    mappedProducts = [
                        { category: "NHÓM MIỄN DỊCH", name: "Reagent HBsAg", barcode: "8934673012345", stt: 1, subItems: [], manufacturer: "Roche", minStock: 5, defaultLot: "LOT_01", defaultExpiry: "2026-12" }
                    ];
                    db.ref('mappedProducts').set(mappedProducts);
                }
                renderMappedProductsTable();
            });
        });

        function formatExpiryDisplay(expiryStr) {
            if (!expiryStr) return '-';
            let cleanStr = expiryStr.trim();
            if (cleanStr.length >= 7 && cleanStr.includes('-')) {
                let parts = cleanStr.split('-');
                if (parts.length >= 2 && parts[0].length === 4) return `${parts[0]}-${parts[1]}`;
            }
            return cleanStr;
        }

        function toggleProductGroup(cat) {
            toggledProductGroups[cat] = toggledProductGroups[cat] !== undefined ? !toggledProductGroups[cat] : true;
            renderMappedProductsTable();
        }

        function renderMappedProductsTable() {
            const tbody = document.querySelector('#mappedProductsTable tbody');
            if (!tbody) return;

            const searchInput = document.getElementById('searchMappedProductsInput');
            const searchKey = searchInput ? searchInput.value.trim().toLowerCase() : '';

            let groups = {};
            mappedProducts.forEach((p, idx) => {
                let cat = p.category || "KHÁC";
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push({ product: p, originalIndex: idx });
            });

            let htmlRows = [];
            for (let cat in groups) {
                let catProds = groups[cat];
                catProds.sort((a, b) => (a.product.stt || 999) - (b.product.stt || 999));

                let isOpen = toggledProductGroups[cat] !== undefined ? toggledProductGroups[cat] : true;
                let icon = isOpen ? '▼' : '▶';

                htmlRows.push(`
                    <tr class="product-group-header" onclick="toggleProductGroup('${cat}')">
                        <td colspan="6" style="padding: 8px 10px; background-color: #e8f4fd; cursor: pointer; font-weight: bold;">
                            <span class="toggle-icon">${icon}</span> 📂 <b>${cat}</b> <span style="font-size:10px; font-weight:normal; color:#555;">(Số lượng sản phẩm: ${catProds.length})</span>
                        </td>
                    </tr>
                `);

                if (isOpen) {
                    catProds.forEach(({ product: p, originalIndex: index }, itemIdx) => {
                        const matchesSearch = !searchKey || 
                            (p.name && p.name.toLowerCase().includes(searchKey)) ||
                            (p.barcode && p.barcode.toLowerCase().includes(searchKey)) ||
                            (p.manufacturer && p.manufacturer.toLowerCase().includes(searchKey));

                        if (matchesSearch) {
                            let subHtml = "";
                            if (p.subItems && p.subItems.length > 0) {
                                subHtml = "<br><div style='font-size:9.5px; color:#004085; margin-top:2px;'><b>Bộ phụ:</b><br>" + 
                                    p.subItems.map(s => `• Mã: <b>${s.barcode}</b> | LOT: <b>${s.lot}</b> | Hạn: <b>${formatExpiryDisplay(s.expiry)}</b>`).join('<br>') + 
                                    "</div>";
                            }

                            htmlRows.push(`<tr>
                                <td style="text-align: center;"><b>${p.stt || (itemIdx + 1)}</b></td>
                                <td><b>${p.category}</b></td>
                                <td><b>${p.name}</b></td>
                                <td><b style="color:#0056b3;">Chính: ${p.barcode}</b>${subHtml}</td>
                                <td>${p.manufacturer || '-'}</td>
                                <td>
                                    <button class="btn-edit" onclick="openEditProductLotModal(${index})">✏️ Sửa</button>
                                    <button class="btn-delete" onclick="deleteProductMapping(${index})">Xóa</button>
                                </td>
                            </tr>`);
                        }
                    });
                }
            }

            tbody.innerHTML = htmlRows.length ? htmlRows.join('') : `<tr><td colspan="6" style="text-align:center; color:#888;">Không tìm thấy sản phẩm phù hợp</td></tr>`;
        }

        function downloadExcelTemplate() {
            let data = [
                ["Nhóm Hóa Chất", "Tên Sản Phẩm", "Barcode", "Hãng Sản Xuất", "Máy Thực Hiện", "Nhiệt Độ Bảo Quản", "Đơn Vị Tính", "Quy Cách", "Tồn Min", "LOT Mặc Định", "Hạn Sử Dụng Mặc Định"],
                ["NHÓM MIỄN DỊCH", "Reagent HBsAg", "8934673012345", "Roche", "Cobas e411", "2-8°C", "Hộp", "100 test/hộp", 5, "LOT123", "2026-12"]
            ];
            let ws = XLSX.utils.aoa_to_sheet(data);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "MauImport");
            XLSX.writeFile(wb, "Mau_Import_SanPham.xlsx");
        }

        function exportProductsToExcel() {
            let data = [["Nhóm Hóa Chất", "Tên Sản Phẩm", "Barcode", "Hãng Sản Xuất", "Tồn Min", "LOT Mặc Định", "Hạn Sử Dụng Mặc Định"]];
            mappedProducts.forEach(p => {
                data.push([p.category, p.name, p.barcode, p.manufacturer, p.minStock, p.defaultLot, p.defaultExpiry]);
            });
            let ws = XLSX.utils.aoa_to_sheet(data);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "DanhSachSanPham");
            XLSX.writeFile(wb, `DanhSach_SanPham.xlsx`);
        }

        function importProductsFromExcel(input) {
            let file = input.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let data = new Uint8Array(e.target.result);
                    let workbook = XLSX.read(data, { type: 'array' });
                    let sheetName = workbook.SheetNames[0];
                    let rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { header: 1 });

                    if (rows.length <= 1) { alert("File không có dữ liệu!"); return; }

                    let count = 0;
                    for (let i = 1; i < rows.length; i++) {
                        let row = rows[i];
                        if (row.length > 0 && row[1]) {
                            let cat = row[0] || "NHÓM MIỄN DỊCH";
                            let catProds = mappedProducts.filter(p => p.category === cat);
                            let nextStt = catProds.length > 0 ? Math.max(...catProds.map(p => p.stt || 0)) + 1 : 1;

                            mappedProducts.push({
                                category: cat,
                                name: row[1],
                                barcode: row[2] ? String(row[2]) : row[1],
                                stt: nextStt,
                                subItems: [],
                                manufacturer: row[3] || "",
                                minStock: parseInt(row[8]) || 0,
                                defaultLot: row[9] ? String(row[9]) : "",
                                defaultExpiry: formatExpiryDisplay(row[10] ? String(row[10]) : "")
                            });
                            count++;
                        }
                    }

                    db.ref('mappedProducts').set(mappedProducts);
                    renderMappedProductsTable();
                    alert(`Đã nhập thành công ${count} sản phẩm từ file Excel!`);
                } catch (err) { alert("Lỗi đọc file Excel!"); }
            };
            reader.readAsArrayBuffer(file);
        }

        function exportFullDatabase() {
            let fullDb = { userAccounts, mappedProducts, inventory, logs };
            let blob = new Blob([JSON.stringify(fullDb, null, 2)], { type: 'application/json' });
            let a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Backup_CSDL_Kho.json`;
            a.click();
        }

        function importFullDatabase(input) {
            let file = input.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let backupData = JSON.parse(e.target.result);
                    let updates = {};
                    if (backupData.userAccounts) updates['users'] = backupData.userAccounts;
                    if (backupData.mappedProducts) updates['mappedProducts'] = backupData.mappedProducts;

                    db.ref().update(updates, (error) => {
                        if (!error) {
                            alert("Khôi phục CSDL thành công!");
                            location.reload();
                        }
                    });
                } catch (err) { alert("File backup không hợp lệ!"); }
            };
            reader.readAsText(file);
        }

        function addProductMapping() {
            const category = document.getElementById('newProdCategory').value;
            const name = document.getElementById('newProdName').value.trim();
            const barcode = document.getElementById('newProdBarcode').value.trim();
            const manufacturer = document.getElementById('newProdManufacturer').value.trim();
            const minStock = parseInt(document.getElementById('newProdMinStock').value) || 0;
            const lot = document.getElementById('newProdLot').value.trim();
            const expiry = formatExpiryDisplay(document.getElementById('newProdExpiry').value);

            if (!name) { alert("Vui lòng nhập Tên sản phẩm!"); return; }

            let catProds = mappedProducts.filter(p => p.category === category);
            let nextStt = catProds.length > 0 ? Math.max(...catProds.map(p => p.stt || 0)) + 1 : 1;

            mappedProducts.push({
                category, name, barcode: barcode || name, stt: nextStt, subItems: [],
                manufacturer, minStock, defaultLot: lot, defaultExpiry: expiry
            });

            db.ref('mappedProducts').set(mappedProducts);
            renderMappedProductsTable();
            document.getElementById('newProdName').value = '';
            document.getElementById('newProdBarcode').value = '';
            alert("Thêm sản phẩm mới thành công!");
        }

        function deleteProductMapping(index) {
            if (confirm("Xóa sản phẩm này khỏi cấu hình?")) {
                mappedProducts.splice(index, 1);
                db.ref('mappedProducts').set(mappedProducts);
                renderMappedProductsTable();
            }
        }

        function openEditProductLotModal(index) {
            let p = mappedProducts[index];
            if (!p) return;
            let newName = prompt("Nhập tên mới cho sản phẩm:", p.name);
            if (newName !== null && newName.trim() !== "") {
                p.name = newName.trim();
                db.ref('mappedProducts').set(mappedProducts);
                renderMappedProductsTable();
                alert("Cập nhật thành công!");
            }
        }

        function openProductModal() { document.getElementById('productModal').style.display = 'block'; }
        function closeProductModal() { document.getElementById('productModal').style.display = 'none'; }
    </script>
</body>
</html>
